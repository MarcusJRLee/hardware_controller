name: CodeQL

on:
  # Analysis runs after merge so pull requests wait only on Verify. Prose
  # cannot change a build; keep this list in step with the prose patterns in
  # scripts/classify_changes.sh. The weekly run bounds any drift.
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - NOTICE
      - ".github/ISSUE_TEMPLATE/**"
      - ".claude/**"
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read
  security-events: write

# Every run analyzes every category of a tree that contains all earlier
# commits, so a newer push supersedes an older one without losing coverage.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          build-mode: none
          languages: actions
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:actions

  macos:
    name: CodeQL (macos)
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL traces every process started after initialization. Rust, the
      # pinned ASR runtime fetch, and SwiftPM manifest evaluation produce no
      # Swift evidence, so preparing them first keeps the traced build to Swift.
      - name: Prepare untraced build inputs
        run: |
          scripts/build_rust_ffi.sh
          scripts/fetch_asr_runtime.sh >/dev/null
          swift package describe --type json >/dev/null
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          build-mode: manual
          languages: swift
          queries: security-extended
      - name: Build Swift products
        run: swift build --arch arm64
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:swift/platform:macos

  ios:
    name: CodeQL (ios)
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned ASR assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/asr_runtime
            .build/asr_test_assets
          key: asr-assets-${{ hashFiles('scripts/fetch_asr_runtime.sh', 'scripts/fetch_asr_test_assets.sh') }}
      - name: Prepare untraced build inputs
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          scripts/prepare_ios_build_inputs.sh
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          build-mode: manual
          languages: swift
          queries: security-extended
      - name: Build Swift products
        run: |
          xcodebuild build -quiet \
            -project apps/ios/voice_input/VoiceInput.xcodeproj \
            -scheme VoiceInput \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/codeql_ios" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:swift/platform:ios
