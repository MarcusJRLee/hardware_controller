name: Pinned swift-format
description: >-
  Restores the pinned formatter, or builds it and saves it immediately so a
  later failing step cannot discard minutes of build.
runs:
  using: composite
  steps:
    # The cached binary is named for its pins, so a pin bump always misses.
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/tools/bin
        key: swift-format-${{ hashFiles('tools/swift_format/Package.swift', 'tools/swift_format/Package.resolved') }}
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/swift_format.sh --version
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/tools/bin
        key: ${{ steps.restore.outputs.cache-primary-key }}
