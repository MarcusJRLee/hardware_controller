name: Pinned uv
description: >-
  Installs the uv release that runs the repo-kit gates in scripts/check_fast.sh,
  verified against its pinned digest. Repository policy allows only GitHub-owned
  actions, so this replaces a third-party setup action.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        UV_VERSION: "0.12.13"
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            target=x86_64-unknown-linux-gnu
            digest=745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd ;;
          macOS-ARM64)
            target=aarch64-apple-darwin
            digest=7e6ddb9316acc00f2296c82ff4d99977870ee34b2f0ddcae9444d714db9364ed ;;
          *)
            echo "No pinned uv for $RUNNER_OS-$RUNNER_ARCH." >&2
            exit 1 ;;
        esac
        directory="$RUNNER_TEMP/uv"
        mkdir -p "$directory"
        curl -fsSL --retry 3 -o "$directory/uv.tar.gz" \
          "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-$target.tar.gz"
        echo "$digest  $directory/uv.tar.gz" | shasum -a 256 -c -
        tar -xzf "$directory/uv.tar.gz" -C "$directory" --strip-components 1
        echo "$directory" >> "$GITHUB_PATH"
