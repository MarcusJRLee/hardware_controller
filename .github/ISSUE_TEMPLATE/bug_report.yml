name: Bug report
description: Report reproducible incorrect behavior without private data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include credentials, transcripts, raw logs, Device serial numbers, private paths, or unsanitized HID captures. Use the private security-reporting link for vulnerabilities.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and the safe error text shown by the app.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest repeatable sequence without private content.
      placeholder: |
        1. Open …
        2. Configure …
        3. Press …
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.6"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Controller model
      description: Do not include a serial number.
      placeholder: VEC Infinity 3
  - type: dropdown
    id: source
    attributes:
      label: Build source
      options:
        - Demo mode from source
        - Signed local build from source
        - Official public release
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, transcripts, raw logs, serial numbers, private paths, and unsanitized captures.
          required: true
