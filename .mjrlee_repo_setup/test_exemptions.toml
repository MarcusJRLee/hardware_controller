reason = "Gate entry point; builds and runs the ASR bridge tests."

[[exempt]]
path = "scripts/check_ios_local_only.sh"
reason = "Gate over iOS sources; check_ios.sh runs it."

[[exempt]]
path = "scripts/check_ios_system_capture_metadata.sh"
reason = "Gate over iOS metadata; check_ios.sh runs it."

[[exempt]]
path = "scripts/check_speech_engine.sh"
