# Sources test_ownership.py accepts without a colocated `<stem>_test.<ext>`;
# format in .mjrlee_repo_setup/hooks/test_ownership.py.

# Swift Package Manager and the iOS project keep tests in separate test
# targets, so a Swift test can never sit beside its source.
# scripts/check_conventions.sh owns Swift test ownership instead: every source
# needs a same-named `<stem>_test(s).swift` in a test target or a reasoned line
# in Tests/untested_sources.txt.
[[exempt]]
path = "Sources/*.swift"
reason = "Swift test targets; scripts/check_conventions.sh enforces name-matched tests."

[[exempt]]
path = "apps/ios/*.swift"
reason = "iOS test targets; scripts/check_conventions.sh enforces name-matched tests."

[[exempt]]
path = "Tests/*.swift"
reason = "Swift test targets: `*_tests.swift` suites, fixtures, and shared test support."

[[exempt]]
path = "*Package.swift"
reason = "SwiftPM manifests; declarations only."

[[exempt]]
path = "tools/app_icons/render_app_icons.swift"
reason = "Renders committed icon art; review the rendered images."

# Rust crate roots only declare modules and re-exports.
[[exempt]]
path = "crates/voice_archive/src/lib.rs"
reason = "Crate root; module declarations and re-exports."

[[exempt]]
path = "crates/voice_core/src/lib.rs"
reason = "Crate root; module declarations and re-exports."

[[exempt]]
path = "crates/voice_models/src/lib.rs"
reason = "Crate root; module declarations and re-exports."

[[exempt]]
path = "crates/voice_models/src/model_package_test_support.rs"
reason = "Test support for model_package_test.rs."

