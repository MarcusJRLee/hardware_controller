# How test_ownership.py treats sources without a colocated same-stem test;
# format in .mjrlee_repo_setup/hooks/test_ownership_policy.py. SwiftPM `Tests/`,
# Cargo `tests/`, and Rust `#[cfg(test)]` are built in.

# Xcode keeps Voice Input's tests in sibling targets.
[[test_root]]
source = "apps/ios/voice_input/"
tests = "apps/ios/voice_input/tests/"

[[test_root]]
source = "apps/ios/voice_input/"
tests = "apps/ios/voice_input/ui_tests/"

# Views, declarations, and system seams whose behavior a differently named
# test covers: the model a view renders, the policy a value feeds, or the fake
# that stands in for a boundary. Composition roots name the test that builds
# them.
