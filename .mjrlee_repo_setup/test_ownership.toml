# Swift files with no behavior of their own.
[[exempt]]
path = "Sources/HardwareControllerApp/design_system.swift"
kind = "styles"
reason = "Colors, radii, and card modifiers."

[[exempt]]
path = "apps/ios/voice_input/shared/voice_input_theme.swift"
kind = "styles"
reason = "The signal color."

[[exempt]]
path = "apps/ios/voice_input/widgets/voice_input_widgets.swift"
kind = "declarations"
reason = "WidgetKit configurations; capture state from the tested `VoiceInputSystemCapturePolicy`."

[[exempt]]
path = "Sources/HardwareControllerApp/application_snapshot.swift"
kind = "declarations"
reason = "The runtime's published value type."

[[exempt]]
path = "apps/ios/voice_input/app/voice_input_app_shortcuts.swift"
kind = "declarations"
reason = "App Shortcuts phrases; scripts/check_ios_system_capture_metadata.sh checks them."

