kind = "declarations"
reason = "Live Activity attributes."

[[exempt]]
path = "apps/ios/voice_input/shared/voice_input_environment.swift"
kind = "constants"
reason = "Build environment identifiers."

[[exempt]]
path = "Sources/HardwareControllerApp/application_entry.swift"
kind = "thin wrapper"
reason = "Dispatches to the app or the installed-app speech check."

[[exempt]]
path = "tools/app_icons/render_app_icons.swift"
kind = "one-shot operator script"
reason = "Renders committed icon art; review the rendered images."

# Gates and build entry points: CI or an install runs each one, and a broken
# one fails that run.
[[exempt]]
path = "scripts/check.sh"
kind = "thin wrapper"
reason = "Gate entry point; runs other checks."

[[exempt]]
path = "scripts/check_fast.sh"
kind = "thin wrapper"
reason = "Gate entry point; runs other checks."

[[exempt]]
