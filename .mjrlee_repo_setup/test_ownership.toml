# How test_ownership.py treats sources without a colocated same-stem test;
# format in .mjrlee_repo_setup/hooks/test_ownership_policy.py. SwiftPM `Tests/`,
# Cargo `tests/`, and Rust `#[cfg(test)]` are built in.

# Xcode keeps Voice Input's tests in sibling targets.
[[test_root]]
source = "apps/ios/voice_input/"
tests = "apps/ios/voice_input/tests/"

[[test_root]]
source = "apps/ios/voice_input/"
tests = "apps/ios/voice_input/ui_tests/"

# Swift files with no behavior of their own.
[[exempt]]
path = "Sources/HardwareControllerApp/design_system.swift"
kind = "styles"
reason = "Colors, radii, and card modifiers."

[[exempt]]
path = "apps/ios/voice_input/shared/voice_input_theme.swift"
kind = "styles"
reason = "The signal color."

[[exempt]]
path = "apps/ios/voice_input/widgets/voice_input_widgets.swift"
kind = "declarations"
reason = "WidgetKit configurations; capture state from the tested `VoiceInputSystemCapturePolicy`."

[[exempt]]
path = "Sources/HardwareControllerApp/application_snapshot.swift"
kind = "declarations"
reason = "The runtime's published value type."

[[exempt]]
path = "apps/ios/voice_input/app/voice_input_app_shortcuts.swift"
kind = "declarations"
reason = "App Shortcuts phrases; scripts/check_ios_system_capture_metadata.sh checks them."

[[exempt]]
path = "apps/ios/voice_input/app/voice_input_system_control_reloader.swift"
kind = "thin wrapper"
reason = "One WidgetKit reload call."

[[exempt]]
path = "Sources/HardwareControllerCore/local_ai_provider_kind.swift"
kind = "declarations"
reason = "One enum."

[[exempt]]
path = "apps/ios/voice_input/shared/voice_input_activity.swift"
kind = "declarations"
reason = "Live Activity attributes."

[[exempt]]
path = "apps/ios/voice_input/shared/voice_input_environment.swift"
kind = "constants"
reason = "Build environment identifiers."

[[exempt]]
path = "Sources/HardwareControllerApp/application_entry.swift"
kind = "thin wrapper"
reason = "Dispatches to the app or the installed-app speech check."

[[exempt]]
path = "tools/app_icons/render_app_icons.swift"
kind = "one-shot operator script"
reason = "Renders committed icon art; review the rendered images."

# Gates and build entry points: CI or an install runs each one, and a broken
# one fails that run.
[[exempt]]
path = "scripts/check.sh"
kind = "thin wrapper"
reason = "Gate entry point; runs other checks."

[[exempt]]
path = "scripts/check_fast.sh"
kind = "thin wrapper"
reason = "Gate entry point; runs other checks."

[[exempt]]
path = "scripts/check_ios.sh"
kind = "thin wrapper"
reason = "Gate entry point; runs other checks."

[[exempt]]
path = "scripts/check_rust.sh"
kind = "thin wrapper"
reason = "Gate entry point; runs other checks."

[[exempt]]
path = "scripts/check_voice_asr_bridge.sh"
kind = "thin wrapper"
reason = "Gate entry point; runs other checks."

[[exempt]]
path = "scripts/check_speech_engine.sh"
kind = "thin wrapper"
reason = "Runs the installed app's speech self-check, which is the test."

[[exempt]]
path = "scripts/check_web_text_delivery.sh"
kind = "thin wrapper"
reason = "Runs the installed app's web text delivery self-check, which is the test."

[[exempt]]
path = "scripts/build_app.sh"
kind = "thin wrapper"
reason = "Build entry point over swift build; CI and install_app.sh run it."

[[exempt]]
path = "scripts/build_ios_device.sh"
kind = "thin wrapper"
reason = "Build entry point over xcodebuild; run on device installs."

[[exempt]]
path = "scripts/build_ios_rust_ffi.sh"
kind = "thin wrapper"
reason = "Build entry point over cargo; prepare_ios_build_inputs.sh runs it."

[[exempt]]
path = "scripts/build_rust_ffi.sh"
kind = "thin wrapper"
reason = "Build entry point over cargo; check_rust.sh and build_app.sh run it."

[[exempt]]
path = "scripts/generate_ios_project.sh"
kind = "thin wrapper"
reason = "XcodeGen call; check_ios.sh fails on a stale project."

[[exempt]]
path = "scripts/prepare_ios_build_inputs.sh"
kind = "thin wrapper"
reason = "Runs the iOS build-input scripts in order."

[[exempt]]
path = "scripts/fetch_asr_runtime.sh"
kind = "vendoring tool"
reason = "Pins and verifies checksums."

[[exempt]]
path = "scripts/fetch_asr_test_assets.sh"
kind = "vendoring tool"
reason = "Pins and verifies checksums."

[[exempt]]
path = "scripts/benchmark_asr.sh"
kind = "one-shot operator script"
reason = "Opt-in benchmark run by hand."

[[exempt]]
path = "scripts/run_demo.sh"
kind = "one-shot operator script"
reason = "Launches the demo app by hand."
