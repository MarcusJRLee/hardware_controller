[workspace]
members = [
  "crates/voice_archive",
  "crates/voice_core",
  "crates/voice_ffi",
  "crates/voice_models",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/MarcusJRLee/hardware_controller"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.11.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
